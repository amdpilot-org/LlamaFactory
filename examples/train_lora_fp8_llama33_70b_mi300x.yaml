### model
model_name_or_path: /root/.cache/huggingface/hub/models--amd--Llama-3.3-70B-Instruct-FP8-KV
adapter_name_or_path: null
do_train: true
finetuning_type: lora
fp8: true
fp8_lora: true
quantization_bit: fp8
quantization_method: aiter_fp8
quantization_type: fp8_e4m3_fn
### dataset
dataset: alpaca
template: alpaca
dataset_dir: data
cutoff_len: 2048
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16
### output
output_dir: saves/llama33-70b-fp8/sft/lora/mi300x
overwrite_output_dir: true
logging_steps: 1
save_steps: 50
plot_loss: true
### train
per_device_train_batch_size: 16
per_device_eval_batch_size: 16
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
num_train_epochs: 1.0
max_steps: 100
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
### lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all
### evaluate
val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50
